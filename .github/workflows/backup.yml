# Backup ditor i databazës (pg_dump) – ruhet si artifact në GitHub për 30 ditë.
# Settings → Secrets → Actions → shto DATABASE_URL
# (Railway → Postgres → Variables → DATABASE_PUBLIC_URL)
name: Backup i databazës

on:
  schedule:
    - cron: "30 2 * * *"   # çdo ditë 02:30 UTC
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Instalo PostgreSQL client
        run: |
          sudo apt-get update -y
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-client-17
      - name: pg_dump
        env:
          DB_URL: ${{ secrets.DATABASE_URL }}
        run: |
          /usr/lib/postgresql/17/bin/pg_dump "$DB_URL" --no-owner --no-privileges -Fc -f bledi-fit-$(date +%F).dump
      - uses: actions/upload-artifact@v4
        with:
          name: bledi-fit-backup
          path: "*.dump"
          retention-days: 30
